---
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /app
    volumes:
      - .:/app
      - build_cache_user:/app/_build
      - rebar3_cache_user:/cache
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["make", "local-test"]

volumes:
  build_cache_user:
  rebar3_cache_user:

networks:
  default:
    ipam:
      config:
        - subnet: 10.42.0.32/28

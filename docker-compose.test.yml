---
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - .:/app
      - build_cache:/app/_build
      - rebar3_cache:/root/.cache/rebar3
      # Forward host SSH agent for private dep fetches (rebar3 git+ssh).
      # Falls back to /dev/null when SSH_AUTH_SOCK is unset on the host
      # so compose still starts; SSH-required deps will fail at fetch
      # in that case (intentional -- loud failure beats silent skip).
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["make", "local-test"]

volumes:
  build_cache:
  rebar3_cache:

networks:
  default:
    ipam:
      config:
        - subnet: 10.42.0.32/28
